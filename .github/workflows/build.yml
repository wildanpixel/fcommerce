name: Build Desktop Artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    name: Windows Desktop
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build React and Electron code
        run: pnpm build

      - name: Stage Puppeteer browser
        run: pnpm --filter @marketplace-intelligence-os/desktop stage:puppeteer -- --platform=win32 --arch=x64

      - name: Package Windows
        run: pnpm --filter @marketplace-intelligence-os/desktop exec electron-builder --win --x64

      - name: Create portable checksum
        shell: pwsh
        run: |
          $portable = Get-ChildItem "apps/desktop/release/*Portable*.exe" | Select-Object -First 1
          if (-not $portable) {
            throw "Windows portable executable was not generated."
          }

          $checksumPath = Join-Path $portable.DirectoryName "$($portable.BaseName).sha256"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $portable.FullName).Hash.ToLowerInvariant()
          "$hash  $($portable.Name)" | Set-Content -LiteralPath $checksumPath -Encoding ascii

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-keyword-competitor-analysis-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged Windows portable release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $portable = Get-ChildItem "apps/desktop/release/*Portable*.exe" | Select-Object -First 1
          $checksum = Get-ChildItem "apps/desktop/release/*Portable*.sha256" | Select-Object -First 1
          if (-not $portable -or -not $checksum) {
            throw "Portable executable or checksum is missing."
          }

          gh release create "${{ github.ref_name }}" `
            --repo "${{ github.repository }}" `
            --verify-tag `
            --title "MarketPlace Keyword Competitor Analysis ${{ github.ref_name }}" `
            --generate-notes `
            "$($portable.FullName)#Windows Portable" `
            "$($checksum.FullName)#SHA-256 checksum"
